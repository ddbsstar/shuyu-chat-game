<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f4fd">
  <meta name="description" content="从陪伴到旅行、做饭，解锁和书钰的聊天。">
  <title>和书钰聊上天</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand"><span class="brand-icon" aria-hidden="true">♡</span> 书钰来信</div>
      <button id="restart" class="restart" type="button">↻ 重新开始</button>
    </header>

    <section class="hero" aria-label="书钰来信">
      <div class="hero-copy">
        <p>互动剧情 · 五关挑战</p>
        <h1>和书钰<br>聊上天</h1>
      </div>
    </section>

    <nav class="progress" aria-label="游戏关卡"><ol id="progress"></ol></nav>
    <main id="game"></main>
    <noscript>打开浏览器的 JavaScript 后就能开始挑战。</noscript>
  </div>
</body>
</html>
